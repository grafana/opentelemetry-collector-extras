receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  partialtracesampler:
    default_sampling_percentage: 10
    ghost_spans: true
    rules:
      # Keep root/server spans from the frontend service.
      - sampling_percentage: 100
        condition: 'resource.attributes["service.name"] == "frontend" and kind == SPAN_KIND_SERVER'
      # Keep leaf spans from payment and currency services to demonstrate
      # sampled -> ghost -> sampled patterns (checkout spans become ghosts).
      - sampling_percentage: 100
        condition: 'resource.attributes["service.name"] == "payment" or resource.attributes["service.name"] == "currency"'

  groupbytrace:
    wait_duration: 5s

  ghostspan:

  batch:

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [partialtracesampler, groupbytrace, ghostspan, batch]
      exporters: [otlp, debug]
