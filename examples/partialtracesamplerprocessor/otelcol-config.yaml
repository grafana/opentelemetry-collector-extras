receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  partialtracesampler:
    default_sampling_percentage: 0
    ghost_spans: true
    rules:
      # Keep root spans at 100% - child spans will be dropped or become ghost spans
      - sampling_percentage: 100
        condition: 'name == "lets-go"'

  batch:

exporters:
  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [partialtracesampler, batch]
      exporters: [otlp, debug]
